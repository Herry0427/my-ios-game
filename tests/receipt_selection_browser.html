<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>记账标签点击测试：运行中</title></head><body>
<div id="receipt-entry-screen"></div>
<button id="receipt-entry-close"></button><button id="receipt-calendar-back"></button><button id="receipt-entry-date"></button>
<div id="receipt-entry-tabs"><button data-type="expense"></button></div>
<div id="receipt-entry-amount"></div><div id="receipt-entry-categories"></div>
<div id="receipt-entry-keypad"><button data-key="1">1</button><button data-key="2">2</button><button data-key="+">+</button><button data-key="*">×</button><button data-key="=">=</button><button data-key="back">⌫</button><button data-key="save">确定</button></div><button id="receipt-entry-tag-toggle"></button><button id="receipt-entry-tag-delete" hidden>删除选中标签</button>
<form id="receipt-entry-tag-form" hidden><input id="receipt-entry-tag-input"></form>
<button id="receipt-entry-note-toggle"></button><input id="receipt-entry-note" hidden>
<span id="receipt-entry-sync-status"></span>
<script>
window.getReceiptOwnerKey = function () { return 'receipt-selection-browser-test'; };
window.getSb = function () { return null; };
window.confirm = function () { return true; };
localStorage.setItem('receipt_account_receipt-selection-browser-test_2026-01-01', JSON.stringify({savedTags:['彩票','早餐']}));
</script>
<script src="../receipt.js"></script>
<script>
(function () {
  var errors = [];
  var grid = document.getElementById('receipt-entry-categories');
  var module = window.ReceiptModule;
  module.onEnterEntry();
  function check(expected) {
    var selected = grid.querySelectorAll('.receipt-entry-category.selected');
    if (selected.length !== (expected ? 1 : 0) || (expected && selected[0].getAttribute('data-category') !== expected))
      errors.push('期望只有 ' + (expected || '零个') + '高亮，实际为 ' + Array.from(selected).map(function (b) { return b.getAttribute('data-category'); }).join(','));
  }
  function click(name) {
    var button = Array.from(grid.querySelectorAll('.receipt-entry-category')).find(function (b) { return b.getAttribute('data-category') === name; });
    if (!button) { errors.push('缺少标签 ' + name); return; }
    button.querySelector('span').click();
    check(name);
  }
  check('');
  click('餐饮');
  click('彩票');
  click('交通');
  click('早餐');
  module._test.addEntryTag('彩票');
  check('彩票');
  var del = document.getElementById('receipt-entry-tag-delete');
  if (del.hidden) errors.push('选中自定义标签后删除按钮未出现');
  del.click();
  check('');
  if (!del.hidden || grid.querySelector('[data-category="彩票"]')) errors.push('删除后标签仍在快捷区');
  click('餐饮');
  if (!del.hidden) errors.push('内置类别显示了删除按钮');
  var keys = document.getElementById('receipt-entry-keypad');
  ['1', '2', '+', '2', '*', '2', '='].forEach(function (key) { keys.querySelector('[data-key="' + key + '"]').click(); });
  if (document.getElementById('receipt-entry-amount').textContent !== '16') errors.push('实际点击计算键后结果不是16');
  keys.querySelector('[data-key="back"]').click();
  if (document.getElementById('receipt-entry-amount').textContent !== '1') errors.push('退格无效');
  keys.querySelector('[data-key="save"]').click();
  var today = module._test.dateKey(new Date());
  var saved = JSON.parse(localStorage.getItem('receipt_account_receipt-selection-browser-test_' + today) || '{}');
  if (!saved.entries || saved.entries[0].amount !== 1 || saved.entries[0].category !== '餐饮') errors.push('点击确定后计算金额未保存');
  document.title = errors.length ? 'FAIL: ' + errors.join('; ') : 'PASS: 标签单选、删除及键盘运算';
})();
</script>
</body></html>
